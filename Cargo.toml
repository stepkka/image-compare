[package]
name = "imagecompare"
version = "0.1.0"
edition = "2021"
description = "A small cross-platform image comparison app with Windows Explorer integration"
license = "MIT"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
rfd = "0.15.3"

[target.'cfg(windows)'.dependencies]
windows-core = "0.61.2"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
